name: CI/CD Pipeline

# Runs every time code is pushed to develop or main (tests also run on pull requests)
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/employee-mgmt

jobs:
  # Step 1: run the tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -v

  # Step 2: build the Docker image and upload it to Docker Hub
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # Step 3: log in to the Azure VM and run the new image
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # main -> production on port 80, develop -> staging on port 8080
      - name: Pick the target environment
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "port=80" >> $GITHUB_OUTPUT
          else
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "port=8080" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker stop emp-${{ steps.target.outputs.name }} || true
            docker rm emp-${{ steps.target.outputs.name }} || true
            docker run -d \
              --name emp-${{ steps.target.outputs.name }} \
              --restart unless-stopped \
              -p ${{ steps.target.outputs.port }}:5000 \
              -v emp-${{ steps.target.outputs.name }}-data:/data \
              ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            sleep 5
            curl -f http://localhost:${{ steps.target.outputs.port }}/health
